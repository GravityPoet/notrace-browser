<!doctype html>
<meta charset="utf-8">
<title>Cloak self-test probe</title>
<!--
  Self-contained fingerprint probe. Defines window.__runProbe() returning a
  Promise<result>. Driven headfully over CDP by run-selftest.mjs; also openable
  by hand for a quick eyeball. The worker-timezone check is the one that caught
  the JS-only spoof leak: a Web Worker reads its own Intl zone, which a page-world
  spoof cannot reach — only the TZ env var (engine level) makes it match.
-->
<pre id="out">running…</pre>
<script>
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label + " timeout")), ms))
  ]);
}

window.__runProbe = function () {
  const out = { ts: Date.now() };
  const nav = navigator;
  return withTimeout((async function () {

  out.webdriver = nav.webdriver === true;              // true == BAD
  out.userAgent = nav.userAgent;
  out.platform = nav.platform;
  out.languages = nav.languages;
  out.hardwareConcurrency = nav.hardwareConcurrency;
  out.deviceMemory = (typeof nav.deviceMemory !== "undefined") ? nav.deviceMemory : null;
  out.headless_apis = {
    contentIndex: typeof window.ContentIndex !== "undefined",
    contacts: "contacts" in nav,
    downlinkMax: !!(nav.connection && "downlinkMax" in nav.connection),
    webdriverDescriptor: (() => {
      try {
        const d = Object.getOwnPropertyDescriptor(Navigator.prototype, "webdriver");
        return d && typeof d.get === "function" ? d.get.call(nav) : nav.webdriver;
      } catch (e) {
        return "ERR:" + e;
      }
    })()
  };
  out.screen = {
    width: screen.width,
    height: screen.height,
    availWidth: screen.availWidth,
    availHeight: screen.availHeight,
    colorDepth: screen.colorDepth,
    pixelDepth: screen.pixelDepth,
    devicePixelRatio: window.devicePixelRatio
  };
  try {
    out.fonts = {
      menlo: !!(document.fonts && document.fonts.check('12px "Menlo"')),
      helveticaNeue: !!(document.fonts && document.fonts.check('12px "Helvetica Neue"')),
      sfPro: !!(document.fonts && document.fonts.check('12px "SF Pro Text"'))
    };
  } catch (e) { out.fonts = { error: String(e) }; }
  out.plugins = Array.from(nav.plugins || []).map((p) => p.name);
  // The bare engine answers [] to both lists. Every name here is one a page can
  // read to identify the product and link the accounts sharing it, so the
  // selftest asserts they stay empty. Installation is confirmed through the
  // handshake instead, which costs window nothing.
  out.cloak = {
    globals: Object.getOwnPropertyNames(window).filter((n) => /^__cloak/.test(n)),
    enumerable: Object.keys(window).filter((n) => /^__cloak/.test(n)),
    fingerprintInstalled: (() => {
      try {
        const shared = Function.prototype.toString.call(null, "cloak.shared-state.v1");
        return !!(shared && typeof shared === "object" && shared.installed
          && shared.installed.fingerprint === true);
      } catch (e) { return false; }
    })()
  };

  // Browser-visible public IP. When --proxy-server is active, this must match
  // the account proxy's preflight IP; otherwise the browser is not using the
  // same network path as the launcher checks.
  try {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 5000);
    const r = await withTimeout(
      fetch("https://api.ipify.org?format=json", { cache: "no-store", signal: ac.signal }),
      5000,
      "fetch ip"
    );
    clearTimeout(timer);
    const j = await r.json();
    out.fetch_ip = j && j.ip ? j.ip : "";
  } catch (e) { out.fetch_ip = "ERR:" + e; }

  // High-entropy client hints (the UA-CH side; honest-Mac should read macOS).
  try {
    out.uaData = nav.userAgentData
      ? await withTimeout(nav.userAgentData.getHighEntropyValues(
          ["platform", "platformVersion", "architecture", "bitness", "model", "uaFullVersion"]), 5000, "uaData")
      : null;
  } catch (e) { out.uaData = { error: String(e) }; }

  // The *shape* of navigator.userAgentData, separately from its values. Handing
  // back a synthesized stand-in object instead of patching the real
  // NavigatorUAData answered "Object" to constructor.name and printed the
  // wrapper's own JavaScript from toString() — either one identifies the
  // companion in a single expression, whatever the values say.
  out.uad_shape = (() => {
    const ud = nav.userAgentData;
    if (!ud) return { present: false };
    try {
      return {
        present: true,
        ctorName: ud.constructor ? ud.constructor.name : null,
        nativePrototype: !!(window.NavigatorUAData
          && Object.getPrototypeOf(ud) === NavigatorUAData.prototype),
        ownProps: Object.getOwnPropertyNames(ud),
        nativeSources: [ud.getHighEntropyValues, ud.toJSON,
          Object.getOwnPropertyDescriptor(NavigatorUAData.prototype, "brands").get]
          .every((fn) => /\{\s*\[native code\]\s*\}/.test(Function.prototype.toString.call(fn))),
      };
    } catch (e) { return { present: true, error: String(e) }; }
  })();

  // Timezone — main thread.
  out.main_tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  out.main_offset = new Date().getTimezoneOffset();

  // Timezone — Web Worker (separate JS global; page-world spoof cannot reach it).
  out.worker_tz = await withTimeout(new Promise((res) => {
    try {
      const code = "self.onmessage=function(){try{postMessage(Intl.DateTimeFormat().resolvedOptions().timeZone)}catch(e){postMessage('ERR:'+e)}}";
      const w = new Worker(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
      const t = setTimeout(() => res("TIMEOUT"), 2500);
      w.onmessage = (ev) => { clearTimeout(t); res(ev.data); try { w.terminate(); } catch (_) {} };
      w.postMessage(1);
    } catch (e) { res("ERR:" + e); }
  }), 4000, "worker timezone").catch((e) => "ERR:" + e);

  // WebGL unmasked vendor/renderer (honest-Mac => Apple/ANGLE).
  try {
    const gl = document.createElement("canvas").getContext("webgl")
            || document.createElement("canvas").getContext("experimental-webgl");
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    out.webgl_vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
    out.webgl_renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  } catch (e) { out.webgl_vendor = out.webgl_renderer = "ERR:" + e; }

  // Canvas hash — varies with the per-account --fingerprint seed.
  try {
    const c = document.createElement("canvas"); c.width = 220; c.height = 50;
    const ctx = c.getContext("2d");
    ctx.textBaseline = "top"; ctx.font = "14px Arial";
    ctx.fillStyle = "#069"; ctx.fillText("Cloak self-test 0123!@#", 2, 2);
    ctx.fillStyle = "rgba(102,200,0,0.55)"; ctx.fillRect(10, 12, 120, 22);
    const pixels = ctx.getImageData(0, 0, c.width, c.height).data;
    let ph = 0; for (let i = 0; i < pixels.length; i += 113) ph = (ph * 33 + pixels[i]) >>> 0;
    out.image_data_hash = ph.toString(16);
    const data = c.toDataURL();
    let h = 0; for (let i = 0; i < data.length; i++) h = (h * 31 + data.charCodeAt(i)) >>> 0;
    out.canvas_hash = h.toString(16);
  } catch (e) { out.canvas_hash = "ERR:" + e; }

  // The same drawing through <canvas> and through OffscreenCanvas. Both realms
  // read the same surface, so a real browser — and the bare engine, whose own
  // per-seed noise reaches both — returns the same pixels from each. Encoders
  // are allowed to choose different container metadata, so keep both the raw
  // byte hash and a decoded-pixel hash in the report; the latter is the actual
  // rendered surface a page can compare.
  out.canvas_realms = await (async () => {
    const fnv = (bytes) => {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 16777619) >>> 0; }
      return (h >>> 0).toString(16);
    };
    const paint = (ctx) => {
      ctx.textBaseline = "top"; ctx.font = "14px Arial";
      ctx.fillStyle = "#069"; ctx.fillText("Cloak realms 0123!@#", 2, 2);
      ctx.fillStyle = "rgba(102,200,0,0.55)"; ctx.fillRect(10, 12, 120, 22);
    };
    const decodedPixels = async (blob) => {
      if (typeof createImageBitmap !== "function") return { error: "createImageBitmap unavailable" };
      const bitmap = await createImageBitmap(blob);
      try {
        const decoded = document.createElement("canvas");
        decoded.width = bitmap.width; decoded.height = bitmap.height;
        const decodedCtx = decoded.getContext("2d");
        if (!decodedCtx) return { error: "decoded canvas context unavailable" };
        return {
          width: bitmap.width,
          height: bitmap.height,
          hash: fnv(decodedCtx.getImageData(0, 0, bitmap.width, bitmap.height).data),
        };
      } finally {
        try { bitmap.close(); } catch (_) {}
      }
    };
    const result = {};
    try {
      const c = document.createElement("canvas"); c.width = 220; c.height = 50;
      const ctx = c.getContext("2d"); paint(ctx);
      result.html_pixels = fnv(ctx.getImageData(0, 0, 220, 50).data);
      const htmlBlob = await new Promise(
        (res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("no blob")))));
      result.html_blob = fnv(new Uint8Array(await htmlBlob.arrayBuffer()));
      result.html_blob_pixels = await decodedPixels(htmlBlob);
      const o = new OffscreenCanvas(220, 50);
      const octx = o.getContext("2d"); paint(octx);
      result.offscreen_pixels = fnv(octx.getImageData(0, 0, 220, 50).data);
      const offscreenBlob = await o.convertToBlob();
      result.offscreen_blob = fnv(new Uint8Array(await offscreenBlob.arrayBuffer()));
      result.offscreen_blob_pixels = await decodedPixels(offscreenBlob);
      // An encode that forgets to undo its noise leaves the page's own canvas
      // corrupted, which is a bug for the page and a moving fingerprint for us.
      result.pixels_after_encode = fnv(ctx.getImageData(0, 0, 220, 50).data);
    } catch (e) { result.error = String(e); }
    return result;
  })();

  // Audio hash — catches whether the per-seed audio surface changes too.
  try {
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ac = new AC(1, 5000, 44100);
    const osc = ac.createOscillator();
    const comp = ac.createDynamicsCompressor();
    osc.type = "triangle";
    osc.frequency.value = 1000;
    comp.threshold.value = -50;
    comp.knee.value = 40;
    comp.ratio.value = 12;
    comp.attack.value = 0;
    comp.release.value = 0.25;
    osc.connect(comp);
    comp.connect(ac.destination);
    osc.start(0);
    const buf = await withTimeout(ac.startRendering(), 5000, "audio");
    const data = buf.getChannelData(0);
    let h = 0;
    for (let i = 0; i < data.length; i += 97) {
      h = (h * 131 + Math.floor((data[i] + 1) * 1000000)) >>> 0;
    }
    out.audio_hash = h.toString(16);
  } catch (e) { out.audio_hash = "ERR:" + e; }

  // WebRTC — collect ICE candidate IPs; any RFC1918/host IP here is a leak.
  out.webrtc_ips = await withTimeout(new Promise((res) => {
    const ips = new Set();
    try {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
      pc.createDataChannel("x");
      pc.onicecandidate = (e) => {
        if (!e || !e.candidate || !e.candidate.candidate) return;
        const m = /([0-9]{1,3}(?:\.[0-9]{1,3}){3})|([a-f0-9]{1,4}(?::[a-f0-9]{1,4}){2,7})/i.exec(e.candidate.candidate);
        if (m) ips.add(m[0]);
      };
      pc.createOffer().then((o) => pc.setLocalDescription(o)).catch(() => {});
      setTimeout(() => { res([...ips]); try { pc.close(); } catch (_) {} }, 2500);
    } catch (e) { res(["ERR:" + e]); }
  }), 4000, "webrtc").catch((e) => ["ERR:" + e]);

  window.__PROBE = out;
  out.probe_done = true;
  try { document.getElementById("out").textContent = JSON.stringify(out, null, 2); } catch (_) {}
  return out;
  })(), 15000, "probe").catch((e) => {
    out.probe_error = String(e);
    out.probe_done = true;
    window.__PROBE = out;
    try { document.getElementById("out").textContent = JSON.stringify(out, null, 2); } catch (_) {}
    return out;
  });
};
</script>
