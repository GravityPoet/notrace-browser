[package]
name = "cloak-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs.workspace = true
fs4.workspace = true
percent-encoding.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
scrypt.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
url.workspace = true
walkdir.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile = "3.10"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
# Used only for the native launch-readiness signal.  The official keyed
# binary remains the license authority; this dependency only tells us when its
# macOS application has entered the main run loop.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "libc"] }
