[[permission]]
identifier = "account-commands"
description = "Allows the main Cloak Picker window to manage local account metadata and launch plans."
commands.allow = [
  "list_accounts",
  "list_trashed_accounts",
  "choose_workspace_export_path",
  "choose_workspace_import_path",
  "export_workspace",
  "preview_workspace_import",
  "import_workspace",
  "cancel_workspace_operation",
  "create_account",
  "rename_account",
  "delete_account",
  "permanently_delete_account",
  "restore_account",
  "set_proxy",
  "set_region",
  "set_group",
  "set_note",
  "set_mark",
  "toggle_locale",
  "auth_status",
  "broker_overview",
  "save_broker_connection",
  "broker_push_account",
  "broker_quota_snapshot",
  "broker_refresh_account",
  "broker_set_cpa",
  "choose_broker_json_import_path",
  "broker_preview_json",
  "broker_import_json",
  "broker_export_json",
  "broker_convert_json",
  "refresh_account_auth",
  "login_account_auth",
  "cancel_account_auth",
  "active_account_auth",
  "set_auth_auto_refresh",
  "set_auth_authority",
  "refresh_all_account_auth",
  "launch_dry_run",
  "launch_preflight",
  "launch_account",
  "launch_web_store",
  "cancel_launch",
  "account_is_running",
  "force_close_all_browsers",
  "browser_process_status",
  "license_session_status",
  "copy_to_clipboard",
  "run_challenge_audit",
  "complete_native_e2e",
